<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCUSMAXXING</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a; color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; overflow: hidden;
        }
        h1 { font-size: 3rem; letter-spacing: 5px; margin-bottom: 5px; text-transform: uppercase; }
        .timer { font-size: 8rem; font-weight: bold; margin: 20px 0; color: #e0e0e0; }
        .controls { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .row { display: flex; gap: 15px; }
        select, button {
            background-color: #1a1a1a; color: #fff; border: 1px solid #333;
            padding: 15px 25px; font-size: 1.2rem; cursor: pointer; text-transform: uppercase;
        }
        button { background-color: #fff; color: #000; font-weight: bold; }
        button.stop-btn { background-color: #ff3333; color: white; border-color: #ff3333; }
        
        /* Ses Kaydırıcı Tasarımı */
        .volume-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        input[type=range] { cursor: pointer; width: 200px; accent-color: #fff; }
    </style>
</head>
<body>

    <h1>Focusmaxxing</h1>
    <div class="timer" id="timeDisplay">00:00</div>

    <div class="controls">
        <div class="row">
            <select id="audioChoice">
                <option value="brown">Brown Noise</option>
                <option value="pink">Pink Noise</option>
                <option value="white">White Noise</option>
                <option value="lofi">Lo-Fi Radio</option>
            </select>
            <button id="focusBtn" onclick="toggleFocus()">FOCUS</button>
        </div>

        <!-- SES AYARI SLIDER'I -->
        <div class="volume-container">
            <span>VOL:</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <audio id="lofi-player" src="https://stream.zeno.fm/f3wvbbqmdg8uv" preload="none"></audio>

    <script>
        let timerInterval, isRunning = false, totalSeconds = 0;
        let audioCtx, gainNode; // gainNode bizim ses düğmemiz olacak

        // SES AYARI DEĞİŞTİĞİNDE TETİKLENİR
        document.getElementById('volumeSlider').addEventListener('input', function(e) {
            let vol = e.target.value;
            // Eğer gürültü (Web Audio) çalıyorsa
            if (gainNode) {
                gainNode.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.01);
            }
            // Eğer Lofi çalıyorsa
            document.getElementById('lofi-player').volume = vol;
        });

        function toggleFocus() {
            let btn = document.getElementById('focusBtn');
            let selectBox = document.getElementById('audioChoice');

            if (!isRunning) {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                playAudio(selectBox.value);
                btn.innerText = "STOP";
                btn.classList.add("stop-btn");
                selectBox.disabled = true;
                isRunning = true;
                timerInterval = setInterval(() => { totalSeconds++; updateDisplay(); }, 1000);
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                clearInterval(timerInterval);
                stopAudio();
                btn.innerText = "FOCUS";
                btn.classList.remove("stop-btn");
                selectBox.disabled = false;
                isRunning = false;
            }
        }

        function updateDisplay() {
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            document.getElementById('timeDisplay').textContent = 
                (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function playAudio(type) {
            stopAudio();
            let currentVol = document.getElementById('volumeSlider').value;

            if (type === 'lofi') {
                let player = document.getElementById('lofi-player');
                player.volume = currentVol;
                player.play();
                return;
            }

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // GainNode: Ses seviyesini kontrol eden ara birim
            gainNode = audioCtx.createGain();
            gainNode.gain.value = currentVol;

            let bufferSize = 4096;
            let noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
            
            if (type === 'white') {
                noiseNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) out[i] = Math.random() * 2 - 1;
                };
            } else if (type === 'brown') {
                let lastOut = 0;
                noiseNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        out[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = out[i];
                        out[i] *= 3.5;
                    }
                };
            } else if (type === 'pink') {
                let b0, b1, b2, b3, b4, b5, b6;
                b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
                noiseNode.onaudioprocess = (e) => {
                    let out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        b0 = 0.99886 * b0 + white * 0.0555179;
                        b1 = 0.99332 * b1 + white * 0.0750759;
                        b2 = 0.96900 * b2 + white * 0.1538520;
                        b3 = 0.86650 * b3 + white * 0.3104856;
                        b4 = 0.55000 * b4 + white * 0.5329522;
                        b5 = -0.7616 * b5 - white * 0.0168980;
                        out[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                        out[i] *= 0.11;
                        b6 = white * 0.115926;
                    }
                };
            }

            // Bağlantı: Gürültü -> Ses Ayarı (Gain) -> Hoparlör
            noiseNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        }

        function stopAudio() {
            if (audioCtx) { audioCtx.close(); audioCtx = null; gainNode = null; }
            let player = document.getElementById('lofi-player');
            player.pause(); player.currentTime = 0;
        }
    </script>
</body>
</html>
