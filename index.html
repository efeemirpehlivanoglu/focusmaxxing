<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCUSMAXXING</title>
    <style>
       
        * { transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a; color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; overflow: hidden;
        }

        h1 { font-size: 3.5rem; letter-spacing: 8px; margin-bottom: 5px; text-transform: uppercase; font-weight: 900; }
        .timer { font-size: 9rem; font-weight: bold; margin: 10px 0; color: #e0e0e0; font-variant-numeric: tabular-nums; }
        
        .controls { display: flex; flex-direction: column; gap: 25px; align-items: center; }
        .row { display: flex; gap: 15px; }

        select, button {
            background-color: #111; color: #fff; border: 1px solid #333;
            padding: 15px 30px; font-size: 1.1rem; cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px;
        }

        button { background-color: #ffffff; color: #000; font-weight: bold; border: none; }
        button:hover { transform: scale(1.05); background-color: #cccccc; }
        button.stop-btn { background-color: #ff3333; color: white; }

        .volume-container { display: flex; align-items: center; gap: 15px; margin-top: 5px; opacity: 0.7; }
        input[type=range] { cursor: pointer; width: 150px; accent-color: #fff; }

        
        .stats { margin-top: 40px; font-size: 0.8rem; color: #444; letter-spacing: 1px; }
        #totalTimeDisplay { color: #888; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Focusmaxxing</h1>
    <div class="timer" id="timeDisplay">00:00</div>

    <div class="controls">
        <div class="row">
            <select id="audioChoice">
                <option value="brown">BROWN NOISE</option>
                <option value="pink">PINK NOISE</option>
                <option value="white">WHITE NOISE</option>
                <option value="lofi">LO-FI RADIO</option>
            </select>
            <button id="focusBtn" onclick="toggleFocus()">FOCUS</button>
        </div>

        <div class="volume-container">
            <span>VOL</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <div class="stats">
        LIFETIME FOCUS: <span id="totalTimeDisplay">0s</span>
    </div>

    <audio id="lofi-player" src="https://stream.zeno.fm/f3wvbbqmdg8uv" preload="none"></audio>

    <script>
        let timerInterval, isRunning = false, totalSeconds = 0;
        let audioCtx, gainNode;

        
        window.onload = () => { showTotalStats(); };

        function toggleFocus() {
            let btn = document.getElementById('focusBtn');
            let selectBox = document.getElementById('audioChoice');

            if (!isRunning) {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                playAudio(selectBox.value);
                btn.innerText = "STOP";
                btn.classList.add("stop-btn");
                selectBox.disabled = true;
                isRunning = true;
                timerInterval = setInterval(() => { 
                    totalSeconds++; 
                    updateDisplay(); 
                }, 1000);
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                clearInterval(timerInterval);
                stopAudio();
                
                // HAFIZAYA KAYDET (İşte o meşhur Local Storage!)
                let savedTotal = parseInt(localStorage.getItem('focus_total_sec') || 0);
                localStorage.setItem('focus_total_sec', savedTotal + totalSeconds);
                
                btn.innerText = "FOCUS";
                btn.classList.remove("stop-btn");
                selectBox.disabled = false;
                isRunning = false;
                totalSeconds = 0; // Kronometreyi sıfırla
                updateDisplay();
                showTotalStats();
            }
        }

        function updateDisplay() {
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;
            let timeString = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
            document.getElementById('timeDisplay').textContent = timeString;
            
            // SEKMEDE SÜREYİ GÖSTER (Dinamik Title)
            document.title = isRunning ? `(${timeString}) FOCUSMAXXING` : "FOCUSMAXXING";
        }

        function showTotalStats() {
            let total = parseInt(localStorage.getItem('focus_total_sec') || 0);
            let mins = Math.floor(total / 60);
            document.getElementById('totalTimeDisplay').textContent = mins + " MINS";
        }

        
        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            let v = e.target.value;
            if (gainNode) gainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
            document.getElementById('lofi-player').volume = v;
        });

        function playAudio(type) {
            stopAudio();
            let v = document.getElementById('volumeSlider').value;
            if (type === 'lofi') {
                let p = document.getElementById('lofi-player'); p.volume = v; p.play(); return;
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain(); gainNode.gain.value = v;
            let bufferSize = 4096;
            let n = audioCtx.createScriptProcessor(bufferSize, 1, 1);
            if (type === 'white') {
                n.onaudioprocess = (e) => { let o = e.outputBuffer.getChannelData(0); for (let i=0; i<bufferSize; i++) o[i] = (Math.random()*2-1)*0.05; };
            } else if (type === 'brown') {
                let l = 0; n.onaudioprocess = (e) => { let o = e.outputBuffer.getChannelData(0); for (let i=0; i<bufferSize; i++) { let w = Math.random()*2-1; o[i] = (l + (0.02*w))/1.02; l = o[i]; o[i] *= 3.5; } };
            } else if (type === 'pink') {
                let b0, b1, b2, b3, b4, b5, b6; b0=b1=b2=b3=b4=b5=b6=0.0;
                n.onaudioprocess = (e) => { let o = e.outputBuffer.getChannelData(0); for (let i=0; i<bufferSize; i++) { let w = Math.random()*2-1; b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980; o[i] = b0+b1+b2+b3+b4+b5+b6+w*0.5362; o[i]*=0.11; b6=w*0.115926; } };
            }
            n.connect(gainNode); gainNode.connect(audioCtx.destination);
        }

        function stopAudio() {
            if (audioCtx) { audioCtx.close(); audioCtx = null; gainNode = null; }
            let p = document.getElementById('lofi-player'); p.pause(); p.currentTime = 0;
        }
    </script>
</body>
</html>
